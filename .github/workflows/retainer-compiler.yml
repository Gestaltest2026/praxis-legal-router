name: Retainer Compiler

on:
  pull_request:
    paths:
      - "src/app/retainer/**"
      - "src/app/api/retainer/**"
      - "src/lib/retainer/**"
      - "src/templates/retainer/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.ts"
  push:
    branches:
      - main
    paths:
      - "src/app/retainer/**"
      - "src/app/api/retainer/**"
      - "src/lib/retainer/**"
      - "src/templates/retainer/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.ts"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test:retainer
      - run: npm run build
